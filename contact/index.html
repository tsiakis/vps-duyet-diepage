<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting</title>
<script>
(function () {
  var token = Date.now();
  document.cookie = 'token=' + token + '; path=/; max-age=300; samesite=lax';
  location.replace('/contact/' + token + '/');
})();
</script>
</head>

</html>
